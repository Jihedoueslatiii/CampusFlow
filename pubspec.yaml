name: compusflow
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Résolution du conflit de version pour satisfaire flutter_localizations
  intl: ^0.20.2

  # Cryptage des mots de passe
  encrypt: ^5.0.1
  crypto: ^3.0.3

  # Stockage local
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.8.3

  # Email
  mailer: ^6.3.0

  # UI et Icons
  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  table_calendar: ^3.0.9

  # Réseau et partage
  http: ^1.1.0
  share_plus: ^7.0.0
  url_launcher: ^6.2.0

  # Fichiers
  file_picker: ^8.0.0
  file_selector: ^0.9.0
  pdfx: ^2.6.0

  # Traductions
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/